<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotina PDPL</title>
<style>
/* Layout: barra lateral azul-marinho da marca (logo, produtor, menu) + área de conteúdo; cada seção = cabeçalho com mês, formulário, gráficos */
:root{
  color-scheme: light;
  --navy:#0b2a4a; --navy-2:#143a5f; --navy-line:rgba(255,255,255,.16); --on-navy:#ffffff; --on-navy-2:#b6c3dc;
  --brand:#29a9c2;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f2f4f8;
  --ink:#0d1526; --ink-2:#4a5368; --muted:#7c8497; --line:#dfe3ea; --axis:#c3c8d2;
  --accent:#0b2a4a; --accent-ink:#ffffff;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b; --crit-ink:#b02a2a;
  --p1:#0b2a4a; --p2:#eb6834; --p3:#1baf7a; --p4:#eda100; --p5:#e87ba4; --p6:#2a78d6; --p7:#7c5cc4; --p8:#8a6d3b;
  --s1:#0b2a4a; --s2:#1f9bb5; --s3:#128c4c; --s4:#7ccbdc; --s5:#5aa86f; --s6:#2c6fa3; --s7:#8a94a8; --s8:#e34948;
  --font:Aptos, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#10141c; --surface:#171c26; --surface-2:#1f2532;
    --ink:#eef1f6; --ink-2:#c0c6d2; --muted:#8b93a3; --line:#2a3140; --axis:#3a4252;
    --accent:#8fb0ff; --accent-ink:#0b1430;
    --good-ink:#2fc22f; --warn-ink:#fab219; --crit-ink:#f07777;
    --p1:#8fb0ff; --p2:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --p6:#3987e5; --p7:#a98bf0; --p8:#b8935a;
    --s1:#9db8f0; --s2:#1a9cb6; --s3:#2fae66; --s4:#7ccbdc; --s5:#6cc08a; --s6:#4a86c8; --s7:#8a94a8; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10141c; --surface:#171c26; --surface-2:#1f2532;
  --ink:#eef1f6; --ink-2:#c0c6d2; --muted:#8b93a3; --line:#2a3140; --axis:#3a4252;
  --accent:#8fb0ff; --accent-ink:#0b1430;
  --good-ink:#2fc22f; --warn-ink:#fab219; --crit-ink:#f07777;
  --p1:#8fb0ff; --p2:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --p6:#3987e5; --p7:#a98bf0; --p8:#b8935a;
    --s1:#9db8f0; --s2:#1a9cb6; --s3:#2fae66; --s4:#7ccbdc; --s5:#6cc08a; --s6:#4a86c8; --s7:#8a94a8; --s8:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;padding:26px 0 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:0 24px 4px;display:flex;align-items:center;gap:12px}
.logo img{width:58px;height:auto;display:block;flex:none}
.logo-name{font-size:21px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.logo-sub{font-size:10.5px;letter-spacing:.14em;color:var(--on-navy-2);margin-top:3px}
.side-block{padding:20px 28px 16px}
.side-block label{display:block;font-size:13px;color:var(--on-navy-2);margin-bottom:4px}
.side select{width:100%;background:var(--navy-2);color:var(--on-navy);border:1px solid var(--navy-line);border-radius:8px;padding:8px 10px;font-size:15px}
.side select option{background:#fff;color:#0d1526}
.menu{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--navy-line)}
.menu button{background:none;border:0;color:var(--on-navy);text-align:left;padding:8px 28px;cursor:pointer;font-size:15px;border-left:4px solid transparent}
.menu button:hover{background:var(--navy-2)}
.menu button[aria-current="page"]{border-left-color:var(--brand);background:var(--navy-2);font-weight:600}
.menu .sep{height:1px;background:var(--navy-line);margin:8px 28px}
.side-foot{margin-top:auto;padding:16px 28px 0;font-size:12px;color:var(--on-navy-2);display:flex;align-items:center;gap:6px}
.side-foot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-navy-2)}
.side-foot.cloud::before{background:var(--brand)}
.side-foot.local::before{background:var(--warn)}
.progbtn{width:100%;background:none;border:1px solid var(--navy-line);color:var(--on-navy);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;text-align:left}
.progbtn:hover,.progbtn[aria-current="page"]{background:var(--navy-2);border-color:var(--brand)}
.ver{padding:6px 28px 0;font-size:11px;color:var(--on-navy-2);opacity:.6;letter-spacing:.03em}

.content{padding:26px 28px 60px;min-width:0}
.blank{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center}
.page-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--accent)}
.page-head h1{font-size:28px;font-weight:600;line-height:1.15}
.page-head .sub{color:var(--ink-2);font-size:14px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav label{font-size:12px;color:var(--muted);margin-right:4px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
select,input[type=month],input[type=date],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 9px;min-width:0;height:36px}
textarea{height:auto;padding:8px 9px}
input:hover,select:hover{border-color:var(--axis)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 14px;height:36px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);margin-bottom:16px;font-size:14px}
.banner p{margin:0;flex:1 1 280px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--line)}
.tile.ok{border-top-color:var(--good)}
.tile.bad{border-top-color:var(--warn)}
.tile .t{font-size:13px;color:var(--ink-2);min-height:2.6em}
.tile .v{font-size:27px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.tile .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:1px 7px;font-size:11.5px;font-weight:600}
.chip.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink)}
.chip.bad{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.up-good{color:var(--good-ink)} .up-bad{color:var(--crit-ink)}
.talk{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
.talk h3{font-size:17px;margin-bottom:6px}
.talk ul{margin:0;padding-left:20px;columns:2 340px;column-gap:28px}
.talk li{margin:3px 0;break-inside:avoid}
.sec-title{font-size:18px;font-weight:600;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h p{margin:0;font-size:12px;color:var(--muted)}
.chart-box{position:relative;height:230px}
.empty{height:230px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;background:var(--surface-2);border-radius:8px;padding:10px}
.dl{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer;color:var(--ink-2);margin-left:auto}
.dl:hover{background:var(--surface-2)}
.no-dl .dl{display:none}

.form-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1150px){.form-wrap{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.box > h3{font-size:16.5px;margin-bottom:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--ink-2);line-height:1.25}
.field label small{color:var(--muted)}
.field input[type=text],.field input[type=date],.field select{width:100%}
.inwrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);height:36px}
.inwrap:focus-within{border-color:var(--accent)}
.inwrap input{border:0!important;flex:1;width:100%;background:none;font-variant-numeric:tabular-nums;height:34px}
.inwrap input:focus{outline:none}
.inwrap span{padding:0 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
th{font-weight:600;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
td input,td select{width:100%;height:32px;padding:0 7px}
td input.num{text-align:right;min-width:70px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.calc{background:var(--surface-2);font-weight:500}
.rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.rm:hover{color:var(--crit-ink)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.preview{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.preview h3{font-size:16px;margin-bottom:8px}
.preview dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:0;font-size:13.5px}
.preview dt{color:var(--ink-2)}
.preview dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.preview .grp{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.savebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.dirty{font-size:12.5px;color:var(--warn-ink);font-weight:600}
.lote{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.lote-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.lgroup{margin-bottom:18px}
.acadd{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.acadd input[type=text]{flex:1 1 220px}.acadd select{flex:0 1 160px}
.alist{list-style:none;margin:0;padding:0}.acao{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.acao .atxt{flex:1;min-width:0}.acao .atxt input{width:100%;border-color:transparent;padding:0 6px;height:32px}.acao .atxt input:hover,.acao .atxt input:focus{border-color:var(--line)}
.acao .ameta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);padding:2px 6px 0}.acheck{padding-top:7px}.acheck input{width:18px;height:18px}
.acao.done .atxt input{text-decoration:line-through;color:var(--muted)}
.livro-hero{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:16px;font-size:16px}
.livro-hero .note{color:var(--on-navy-2)}.lh-n{font-size:46px;font-weight:700;line-height:1;color:var(--brand)}
.lsec{font-size:18px;margin:22px 0 10px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.lcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;font-size:15px}
.lbody{flex:1;min-width:0}.lname{font-weight:600;font-size:15.5px}.lquote{margin:6px 0 0;font-style:italic;color:var(--ink-2);font-size:13.5px}
.msel{border:1px solid var(--line);border-radius:8px;background:var(--surface)}.msel>summary{cursor:pointer;padding:8px 10px;list-style:none;min-height:36px}
.msel>summary::-webkit-details-marker{display:none}.msel>summary::after{content:" ▾";color:var(--muted)}.msel-box{padding:4px 12px 12px;border-top:1px solid var(--line)}
.sortb{border:0;background:none;font:inherit;font-weight:600;color:inherit;cursor:pointer;padding:0;text-align:right}
.stp{border:0;background:var(--surface-2);width:34px;height:34px;cursor:pointer;font-size:17px;color:var(--ink);flex:none}
.stp:first-child{border-radius:7px 0 0 7px}.stp:last-child{border-radius:0 7px 7px 0}
.stp:hover{background:var(--line)}
.lgroup-h{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.lgroup-h h3{font-size:16.5px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px}
.subtabs .fchip{padding:7px 16px;font-size:14px}
.lote-head .field{flex:1 1 120px}
.lote-head .field.wide{flex:2 1 160px}
.lote-head .btn{flex:none}

.losum{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.losum b{color:var(--ink);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);height:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.result div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.result span{display:block;font-size:12.5px;color:var(--ink-2)}
.result b{font-size:20px;font-variant-numeric:tabular-nums}
.result .money{background:color-mix(in srgb,var(--crit) 12%,var(--surface))}
.hist{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;margin-bottom:22px}
.hist th:first-child,.hist td:first-child{position:sticky;left:0;background:var(--surface);min-width:220px;white-space:normal}
.hist td.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)!important;font-weight:600}
.hist td small{color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.modal-box{background:var(--surface);border-radius:12px;padding:18px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-box p{margin:0 0 14px}
.modal-box .row-actions{justify-content:flex-end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
#pdfStage{position:fixed;left:-10000px;top:0;width:900px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px 0 6px}
  .logo img{max-width:170px}
  .side-block{padding:12px 16px}
  .menu{flex-direction:row;overflow-x:auto;padding:0}
  .menu button{white-space:nowrap;padding:10px 14px;border-left:0;border-bottom:3px solid transparent}
  .menu button[aria-current="page"]{border-bottom-color:var(--brand)}
  .menu .sep{display:none}
  .side-foot{padding:8px 16px 0}
  .content{padding:18px 16px 50px}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
input[data-pk="id"]{min-width:86px}
table.ctr th,table.ctr td{text-align:center}
.perchip{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:14px;padding:0 14px;cursor:pointer}
.perchip:hover{border-color:var(--accent)}
.rowlink{cursor:pointer}.rowlink:hover td{background:var(--surface-2)}
.dt-soon{color:#b35c00;font-weight:600}.dt-late{color:#b3261e;font-weight:700}
.est{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink2)}
.est-prenhe{background:rgba(18,140,76,.14);color:#0d6b3a}.est-inseminada{background:rgba(31,155,181,.15);color:#13697b}.est-seca{background:rgba(124,92,196,.14);color:#5b3fa0}.est-prparto{background:rgba(235,104,52,.16);color:#a3441a}.est-descarte{background:rgba(179,38,30,.12);color:#8c1d17}
svg.mi{width:18px;height:18px;flex:none;margin-right:10px;vertical-align:-4px;opacity:.88}
.est-empev{background:rgba(154,163,181,.22);color:#4a5368}.est-aberta{background:rgba(235,104,52,.16);color:#a3441a}
.sanbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 8px}.sanbar select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.sangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:360px;overflow:auto;padding:2px}
.sanit{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px;min-height:44px}
.sanit span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sanit.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sanit input{width:18px;height:18px;flex:none}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:4px 0 12px}.prog span{display:block;height:100%;background:var(--good,#128c4c)}
.rot{list-style:none;margin:0;padding:0}.rot li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}.rot li .btn{margin-left:auto}
.rot .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}.rot li.ok .ck{background:#128c4c;border-color:#128c4c;color:#fff}

<script>
"use strict";
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const toNum = v => { if (v === "" || v == null) return null; let s = String(v).trim().replace(/\s/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); if (s === "") return null; const n = Number(s); return isFinite(n) ? n : null; };
const div = (a, b) => (isNum(a) && isNum(b) && b !== 0) ? a / b : null;
const pct = (a, b) => { const r = div(a, b); return r == null ? null : r * 100; };
const sumN = (...xs) => { const v = xs.filter(isNum); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
const mul = (a, b) => (isNum(a) && isNum(b)) ? a * b : null;
const mean = xs => { const v = xs.filter(isNum); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const fmt = (n, d = 1) => isNum(n) ? n.toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d}) : "—";
const brl = (n, d = 2) => isNum(n) ? "R$ " + fmt(n, d) : "—";
const numIn = v => isNum(v) ? String(v).replace(".", ",") : "";
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_L = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const ymLabel = ym => { const [y, m] = ym.split("-"); return MESES[+m - 1] + "/" + y.slice(2); };
const ymLong = ym => { const [y, m] = ym.split("-"); return MESES_L[+m - 1] + " de " + y; };
const ymShift = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + "-" + String(m).padStart(2, "0"); };
const daysIn = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const nowYm = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const DAY = 864e5, MES = 30.42;
function parseDate(s) {
  if (!s) return null; s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1]); }
  return null;
}
const isoDate = d => d ? d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") : "";
const brDate = s => { const d = parseDate(s); return d ? String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear() : "—"; };
const midMonth = ym => new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 15);
const dayDiff = (a, b) => Math.round((a - b) / DAY);
const norm = s => String(s || "").trim().toLowerCase();
const normId = s => String(s || "").toUpperCase().replace(/[\s\-\u2013.\/]/g, "");
function nascFromBrinco(id) { const m = normId(id).match(/^(\d)(\d{1,2})[A-Z]+$/); if (!m) return ""; const mo = +m[2]; if (mo < 1 || mo > 12) return "";
  let y = 2020 + +m[1]; if (y > new Date().getFullYear()) y -= 10; return y + "-" + String(mo).padStart(2, "0") + "-15"; }
const todayIso = () => isoDate(new Date());
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3600); }
function ask3(msg, yes, alt) {
  return new Promise(res => {
    $("#modalMsg").textContent = msg; $("#modalYes").textContent = yes; $("#modalAlt").textContent = alt; $("#modalAlt").hidden = false; $("#modal").classList.add("on"); $("#modalYes").focus();
    const done = v => { $("#modal").classList.remove("on"); $("#modalAlt").hidden = true; $("#modalYes").onclick = $("#modalNo").onclick = $("#modalAlt").onclick = null; res(v); };
    $("#modalYes").onclick = () => done("yes"); $("#modalAlt").onclick = () => done("alt"); $("#modalNo").onclick = () => done("no");
  });
}
function askPin(msg) {
  return new Promise(res => {
    $("#modalMsg").textContent = msg; $("#modalYes").textContent = "Entrar"; $("#modalPin").hidden = false; $("#pinIn").value = ""; $("#pinRem").checked = false; $("#modal").classList.add("on"); setTimeout(() => $("#pinIn").focus(), 30);
    const done = v => { $("#modal").classList.remove("on"); $("#modalPin").hidden = true; $("#modalYes").onclick = $("#modalNo").onclick = $("#pinIn").onkeydown = null; res(v); };
    $("#modalYes").onclick = () => done({pin: $("#pinIn").value, remember: $("#pinRem").checked}); $("#modalNo").onclick = () => done(null);
    $("#pinIn").onkeydown = ev => { if (ev.key === "Enter") $("#modalYes").click(); };
  });
}
async function hashPin(pin, salt) {
  const txt = salt + "|" + pin;
  try { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join(""); }
  catch (e) { let h = 5381; for (const ch of txt) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return "x" + h.toString(16); }
}
const unlocked = new Set();
const PINS_LS = "rotina-pdpl-pins";
function remembered() { try { return JSON.parse(localStorage.getItem(PINS_LS) || "{}"); } catch (e) { return {}; } }
function remember(fid, h) { try { const r = remembered(); if (h) r[fid] = h; else delete r[fid]; localStorage.setItem(PINS_LS, JSON.stringify(r)); } catch (e) {} }
function isLocked(f) { return !!(f && f.pinHash && !unlocked.has(f.id) && remembered()[f.id] !== f.pinHash); }
async function unlockFarm(f) {
  if (!isLocked(f)) { if (f) unlocked.add(f.id); return true; }
  for (;;) {
    const r = await askPin(`${farmLabel(f)} tem senha. Digite a senha para abrir.`); if (!r) return false;
    if (await hashPin(r.pin, f.pinSalt) === f.pinHash) { unlocked.add(f.id); if (r.remember) remember(f.id, f.pinHash); return true; }
    toast("Senha incorreta.");
  }
}
function ask(msg, yes = "Confirmar") {
  return new Promise(res => {
    $("#modalMsg").textContent = msg; $("#modalYes").textContent = yes; $("#modal").classList.add("on"); $("#modalYes").focus();
    const done = v => { $("#modal").classList.remove("on"); $("#modalYes").onclick = $("#modalNo").onclick = null; res(v); };
    $("#modalYes").onclick = () => done(true); $("#modalNo").onclick = () => done(false);
  });
}

/* ============ definições ============ */
const METAS_PADRAO = {
  lPorVL: {v: 20, dir: "min", t: "Leite por vaca em lactação (L/dia)"},
  pctLact: {v: 83, dir: "min", t: "Vacas em lactação / total de vacas (%)"},
  pctVacasReb: {v: 45, dir: "min", t: "Vacas em lactação / total do rebanho (%)"},
  del: {v: 180, dir: "max", t: "DEL médio (dias)"},
  ccs: {v: 400, dir: "max", t: "CCS do tanque (mil cél/mL)"},
  cbt: {v: 100, dir: "max", t: "CBT (mil UFC/mL)"},
  cmtPerda: {v: 5, dir: "max", t: "Perdas no CMT (%)"},
  relLC: {v: 2.5, dir: "min", t: "Relação leite:concentrado (L/kg)"},
  pctConcRenda: {v: 35, dir: "max", t: "Concentrado sobre a renda bruta do leite (%)"},
  pctVolRenda: {v: 15, dir: "max", t: "Volumoso sobre a renda bruta do leite (%)"},
  pctAlimRenda: {v: 50, dir: "max", t: "Custo com alimentação sobre a renda do leite (%)"},
  crGmd: {v: 0.7, dir: "min", t: "GMD de bezerras e novilhas (kg/dia)"},
  crGpp: {v: 0.7, dir: "min", t: "GPP de bezerras e novilhas (kg/dia)"},
  crIA: {v: 15, dir: "max", t: "Idade à 1ª IA prevista (meses)"},
  crIPP: {v: 24, dir: "max", t: "Idade ao 1º parto prevista (meses)"}
};
const CATS_ANIM = {vaca: "Vaca", novilha: "Novilha", bezerra: "Bezerra", macho: "Macho"};
const CATS_LOTE = {lact: "Vacas em lactação", seca: "Vacas secas", pre: "Pré-parto", bez: "Bezerras e bezerros", nov: "Novilhas", touro: "Touros", out: "Outros"};
const TIPOS = {conc: "Concentrado", vol: "Volumoso", min: "Mineral/aditivo", out: "Outro"};
const ROTINA = [
  {t: "Rebanho", hint: "contagem no dia da visita", f: [["vl", "Vacas em lactação", "cab"], ["vs", "Vacas secas", "cab"], ["pp", "Pré-parto <small>(conta como seca)</small>", "cab"],
    ["nov", "Novilhas", "cab"], ["novm", "Novilhos", "cab"], ["bzf", "Bezerras", "cab"], ["bzm", "Bezerros", "cab"], ["touro", "Touros", "cab"], ["serv", "Animais de serviço <small>(fora do rebanho)</small>", "cab"]]},
  {t: "Produção de leite", hint: "litros por dia", f: [["lBez", "Leite para bezerros", "L/dia"], ["lFam", "Leite para mão de obra familiar", "L/dia"], ["lContr", "Leite para mão de obra contratada", "L/dia"], ["lVend", "Leite vendido", "L/dia"]]}
];
const LEITE_K = ["lBez", "lFam", "lContr", "lVend"];
const QUAL = [["ccs", "CCS", "mil cél/mL"], ["cbt", "CBT", "mil UFC/mL"], ["gord", "Gordura", "%"], ["prot", "Proteína", "%"]];
const CMTF = [["cmtVacas", "Vacas testadas", "vacas"], ["cmtPerd", "Tetos perdidos", "tetos"], ["cmt1", "Tetos com +", "tetos"],
  ["cmt2", "Tetos com ++", "tetos"], ["cmt3", "Tetos com +++", "tetos"], ["preco", "Preço do leite", "R$/L"]];

/* ============ estado e armazenamento ============ */
const S = {livro: [], farms: {}, recs: {}, anims: {}, acoes: {}, ocor: {}, farmId: null, ym: nowYm(), view: "painel", demo: false, loaded: false};
let col = null, downloads = null;
const LS = "rotina-pdpl-v1";
function lsLoad() { try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j) { S.livro = j.livro || []; S.acoes = j.acoes || {}; S.farms = j.farms || {}; S.recs = j.recs || {}; S.anims = j.anims || {}; } } catch (e) {} }
function lsSave() { try { localStorage.setItem(LS, JSON.stringify({farms: S.farms, recs: S.recs, anims: S.anims, acoes: S.acoes, ocor: S.ocor, livro: S.livro})); } catch (e) {} }
const recKey = (fid, ym) => fid + "|" + ym;
const farms = () => S.demo ? DEMO.farms : S.farms;
const recs = () => S.demo ? DEMO.recs : S.recs;
const animsOf = fid => ((S.demo ? DEMO.anims : S.anims)[fid] || []);
const farm = () => S.farmId ? farms()[S.farmId] : null;
const rec = (ym = S.ym, fid = S.farmId) => recs()[recKey(fid, ym)];
const tecList = f => (f && f.tecnicos && f.tecnicos.length ? f.tecnicos : (f && f.tecnico ? [f.tecnico] : [])).filter(Boolean);
const tecText = f => tecList(f).join(", ");
const estText = f => ((f && f.estagiarios) || []).filter(e => e.nome).map(e => e.nome).join(", ");
const farmLabel = f => f ? (f.produtor || f.nome || "Sem nome") : "";
function farmMonths(fid = S.farmId) { return Object.values(recs()).filter(r => r.farmId === fid).map(r => r.ym).sort(); }
function metas(f = farm()) { const m = {}; Object.keys(METAS_PADRAO).forEach(k => { const x = f && f.metas && f.metas[k]; m[k] = {v: x && isNum(x.v) ? x.v : METAS_PADRAO[k].v, dir: METAS_PADRAO[k].dir}; }); return m; }

async function writeDoc(id, obj) { if (col) await col.doc(id).set(obj); else lsSave(); }
async function delDoc(id) { if (col) await col.doc(id).delete(); else lsSave(); }
function guardDemo() { if (S.demo) { toast("Este é o produtor de exemplo. Cadastre um produtor seu para salvar dados."); return true; } return false; }
async function saveFarm(f) { if (guardDemo()) return false; S.farms[f.id] = f; try { await writeDoc("farm_" + f.id, f); return true; } catch (e) { return failed(e); } }
async function saveRec(r) { if (guardDemo()) return false; r.updated = new Date().toISOString(); S.recs[recKey(r.farmId, r.ym)] = r; try { await writeDoc("rec_" + r.farmId + "_" + r.ym, r); return true; } catch (e) { return failed(e); } }
const acoesOf = fid => ((S.demo ? DEMO.acoes : S.acoes)[fid] || []);
async function saveAcoes(fid, list) { if (guardDemo()) return false; S.acoes[fid] = list; try { await writeDoc("acoes_" + fid, {farmId: fid, list}); return true; } catch (e) { return failed(e); } }
async function saveLivro(list) {
  // o livro só cresce: nenhum nome que já está nele pode sair
  const ids = new Set(list.map(x => x.id)); list = list.concat(S.livro.filter(x => !ids.has(x.id)));
  list.forEach(x => { if (!x.criadoEm) x.criadoEm = new Date().toISOString(); });
  S.livro = list; try { await writeDoc("livro", {list}); return true; } catch (e) { return failed(e); } }
async function saveAnims(fid, list) { if (guardDemo()) return false; S.anims[fid] = list; try { await writeDoc("anim_" + fid, {farmId: fid, list}); return true; } catch (e) { return failed(e); } }
async function deleteRec(fid, ym) { if (guardDemo()) return false; delete S.recs[recKey(fid, ym)]; try { await delDoc("rec_" + fid + "_" + ym); return true; } catch (e) { return failed(e); } }
async function deleteFarm(fid) {
  if (guardDemo()) return false;
  const months = farmMonths(fid);
  delete S.farms[fid]; delete S.anims[fid]; months.forEach(m => delete S.recs[recKey(fid, m)]);
  try { await delDoc("farm_" + fid); await delDoc("anim_" + fid); for (const m of months) await delDoc("rec_" + fid + "_" + m); return true; } catch (e) { return failed(e); }
}
function failed(e) {
  const c = e && e.code;
  toast(c === "quota_exceeded" ? "O espaço de armazenamento acabou. Exclua meses antigos para liberar." : c === "invalid_argument" ? "Não foi possível salvar: os dados são grandes demais ou você não tem permissão." : "Não foi possível salvar agora. Tente de novo em instantes.");
  return false;
}
function setStatus(kind, text) { const s = $("#status"); s.className = "side-foot " + kind; s.textContent = text; }

/* ============ cálculos ============ */
function lotesOf(r) {
  if (r.lotes) return {lotes: r.lotes, ingr: r.ingr || [], mix: r.mix || []};
  if (r.dieta && r.dieta.length) { // dados antigos: uma dieta só das vacas em lactação
    const ingr = r.dieta.map((x, i) => ({id: "old" + i, n: x.n || "Item " + (i + 1), t: x.t || "conc", p: x.p}));
    return {ingr, mix: [], lotes: [{id: "old", nome: "Vacas em lactação", cat: "lact", qtd: (r.d || {}).vl, lc: true, itens: r.dieta.map((x, i) => ({ing: "old" + i, kg: x.kg}))}]};
  }
  return {lotes: [], ingr: r.ingr || [], mix: r.mix || []};
}
/* fórmula de concentrado: preço e MS saem da mistura */
function mixStats(m, ingr) {
  const gm = new Map((ingr || []).map(x => [x.id, x])); let kg = 0, custo = 0, msk = 0, msOk = true;
  const rows = (m.comp || []).map(c => { const g = c.ing ? gm.get(c.ing) : null; const n = c.n || (g && g.n) || ""; const p = isNum(c.p) ? c.p : g && isNum(g.p) ? g.p : null; const ms = isNum(c.ms) ? c.ms : g && isNum(g.ms) ? g.ms : null;
    const k = isNum(c.kg) ? c.kg : 0; const v = isNum(p) ? k * p : null; kg += k; custo += v || 0; if (isNum(ms)) msk += k * ms; else if (k) msOk = false; return {n, kg: k, p, ms, custo: v}; });
  rows.forEach(r => r.pct = kg ? r.kg / kg * 100 : null);
  return {rows, kg, custo, p: kg ? custo / kg : null, ms: kg && msOk ? msk / kg : null};
}
function ingMap(ingr, mix) {
  const m = new Map(ingr.map(x => [x.id, x]));
  (mix || []).forEach(x => { const s = mixStats(x, ingr); m.set(x.id, {id: x.id, n: x.nome || "Fórmula", t: "conc", p: s.p, ms: s.ms, mix: true}); });
  return m;
}
function prevSession(r, key) {
  const ms = farmMonths(r.farmId).filter(m => m < r.ym).reverse();
  for (const m of ms) { const p = recs()[recKey(r.farmId, m)]; if (!p) continue;
    if (key === "cr" && p.cr && (p.cr.rows || []).some(x => isNum(x.peso))) return {ym: m, rows: p.cr.rows, date: parseDate(p.cr.data) || midMonth(m)};
    if (key === "pes" && (p.pes || []).some(x => isNum(x.l))) return {ym: m, rows: p.pes, date: parseDate(p.dataPes) || midMonth(m)};

async function chartPNG(id, title) {
  const src = document.getElementById(id); if (!src) return null;
  const T = theme(); const pad = 24, head = 64, sc = Math.max(1, src.width / (src.clientWidth || src.width));
  const cv = document.createElement("canvas"); cv.width = src.width + pad * 2 * sc; cv.height = src.height + (pad + head) * sc;
  const x = cv.getContext("2d"); x.fillStyle = T.surface; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = T.ink; x.font = `600 ${18 * sc}px ${css("--font")}`; x.fillText(title, pad * sc, (pad + 14) * sc);
  x.fillStyle = T.muted; x.font = `${12 * sc}px ${css("--font")}`; x.fillText(`${farmLabel(farm())} · ${ymLong(S.ym)} · Rotina PDPL`, pad * sc, (pad + 34) * sc);
  x.drawImage(src, pad * sc, (pad + head - 8) * sc);
  return new Promise(r => cv.toBlob(r, "image/png"));
}

const TILES = ["leiteDia", "lPorVL", "lTrab", "pctLact", "ccs", "cbt", "cmtPerda", "pctConcRenda", "pctVolRenda", "del", "crGmd", "crIPP"];
function tileState(k, v, M) { const m = M[k]; if (!m || !isNum(v)) return null; return m.dir === "min" ? v >= m.v : v <= m.v; }
function liveDel(c0) { const v = reproStats(animsOf(S.farmId), farmPev(), todayIso()).delMed; return isNum(v) ? Object.assign({}, c0, {del: v}) : c0; }
function tileHTML(k, c, p, M) {
  const i = INDK[k]; const v = c[k]; const pv = p ? p[k] : null; const st = tileState(k, v, M); const m = M[k];
  const chip = st == null ? "" : `<span class="chip ${st ? "ok" : "bad"}">${st ? "✓ Na meta" : "! Fora da meta"}</span><span>meta ${m.dir === "min" ? "≥" : "≤"} ${fmtInd(k, m.v)}</span>`;
  let delta = "";
  if (isNum(v) && isNum(pv)) { const dd = v - pv, up = dd > 0, pp = pv !== 0 ? dd / Math.abs(pv) * 100 : null;
    const dc = (i.up !== undefined && dd !== 0) ? ((up === i.up) ? "up-good" : "up-bad") : "";
    delta = `<span class="${dc}">${dd === 0 ? "=" : up ? "▲" : "▼"} ${isNum(pp) ? fmt(Math.abs(pp), 0) + "%" : ""} vs mês anterior</span>`; }
  return `<div class="tile ${st == null ? "" : st ? "ok" : "bad"}"><div class="t">${esc(i.t)}</div><div class="v">${i.money && isNum(v) ? "<small style='margin:0 3px 0 0'>R$</small>" : ""}${fmt(v, i.d)}<small>${esc(i.money ? i.u.replace("R$", "") : i.u)}</small></div><div class="meta">${chip}</div><div class="meta">${delta}</div></div>`;
}
function talkingPoints(c, p, M) {
  const out = [];
  Object.keys(M).forEach(k => { const v = c[k]; if (!INDK[k] || tileState(k, v, M) !== false) return;
    out.push(`<strong>${esc(INDK[k].t)}</strong> em ${fmtInd(k, v)} ${esc(INDK[k].u)}, ${M[k].dir === "min" ? "abaixo" : "acima"} da meta de ${fmtInd(k, M[k].v)}.`); });
  if (c.ccs > 500) out.push(`<strong>CCS do tanque acima de 500 mil cél/mL</strong>, limite da IN 76/2018.`);
  if (c.cbt > 300) out.push(`<strong>CBT acima de 300 mil UFC/mL</strong>, limite da IN 76/2018.`);
  const cr3 = cronicas(S.farmId, S.ym); if (cr3.length) { const al = animsOf(S.farmId); out.push(`<strong>${cr3.length} ${cr3.length === 1 ? "vaca crônica" : "vacas crônicas"}</strong> (acima de 200 mil nas 3 últimas análises): ${cr3.slice(0, 10).map(x => { const a = al.find(q => normId(q.id) === x.id); return esc((a && a.nome) || x.id); }).join(", ")}${cr3.length > 10 ? "…" : ""}. Avaliar tratamento na secagem, linha de ordenha ou descarte.`); }
  if (isNum(c.ccsPerdaRS) && c.ccsPerdaRS > 0 && c.pesPts) { const top = c.pesPts.filter(x => x.perda > 0).sort((a, b) => b.perda - a.perda).slice(0, 5);
    out.push(`<strong>Pela CCS individual, a mastite subclínica custa cerca de ${brl(c.ccsPerdaRS, 0)} por mês</strong> (${fmt(c.ccsPerdaDia, 1)} kg/dia). As que mais pesam: ${top.map(x => esc(x.nome || x.id)).join(", ")}.`); }
  if (isNum(c.cmtPerdaRS) && c.cmtPerdaRS > 0) out.push(`<strong>A mastite custa cerca de ${brl(c.cmtPerdaRS, 0)} por mês</strong> (${fmt(c.cmtPerdaDia, 1)} L/dia que deixam de ser produzidos).`);
  (c.lotes || []).filter(x => x.lact && isNum(x.rmcaAn) && x.rmcaAn < 0).forEach(x => out.push(`<strong>Lote ${esc(x.nome)}</strong> não paga a própria dieta: precisa de ${fmt(x.lManter, 1)} L/vaca/dia e produz ${fmt(x.leite, 1)}.`));
  if (c.cr_) { const lentas = c.cr_.rows.filter(x => isNum(x.gmd) && x.gmd < M.crGmd.v); if (lentas.length) out.push(`<strong>${lentas.length} ${lentas.length === 1 ? "animal" : "animais"} da recria com GMD abaixo da meta</strong>: ${lentas.slice(0, 10).map(x => esc(x.id)).join(", ")}${lentas.length > 10 ? "…" : ""}.`); }
  if (p) ["lPorVL", "preco", "ccs", "crGmd", "rmcaVaca"].forEach(k => { const v = c[k], pv = p[k]; if (!isNum(v) || !isNum(pv) || pv === 0) return;
    const ch = (v - pv) / Math.abs(pv) * 100; if (Math.abs(ch) >= 8) out.push(`<strong>${esc(INDK[k].t)}</strong> ${ch > 0 ? "subiu" : "caiu"} ${fmt(Math.abs(ch), 0)}% em relação ao mês anterior (${fmtInd(k, pv)} → ${fmtInd(k, v)}).`); });
  return out;
}

let F = null, A = null, dirtyRec = false, dirtyAnim = false, livePreview = null;

function ensureForm() {
  if (!F || F.farmId !== S.farmId || F.ym !== S.ym) {
    const r = rec(); F = r ? clone(r) : blankRec(); F.d = F.d || {}; F.pes = F.pes || []; F.cr = F.cr || {data: "", dataAnt: "", rows: []}; F.cr.rows = F.cr.rows || [];
    if (!F.lotes) { const lo = lotesOf(F); F.lotes = clone(lo.lotes); F.ingr = clone(lo.ingr); }
    F.ingr = F.ingr || []; F.mix = F.mix || [];
    if (isNum(F.d.prodTotal) && !isNum(F.d.leiteDia)) F.d.leiteDia = Math.round(F.d.prodTotal / (F.d.dias || daysIn(F.ym)));
    dirtyRec = false;
  }
  if (!A || A._fid !== S.farmId) { A = clone(animsOf(S.farmId)); A._fid = S.farmId; dirtyAnim = false; }
}

function calcF() { return calc(F, animList(), farm()); }

function fieldHTML([k, label, unit]) { return `<div class="field"><label for="f_${k}">${label}</label><div class="inwrap"><input id="f_${k}" data-k="${k}" type="text" inputmode="decimal" autocomplete="off" value="${numIn(F.d[k])}"><span>${esc(unit)}</span></div></div>`; }

function previewHTML(groups, c) { return groups.map(([g, ks]) => `<div class="grp">${g}</div>` + ks.map(k => `<dt>${esc(INDK[k].t)} <small class="note">${esc(INDK[k].u)}</small></dt><dd>${fmtInd(k, c[k])}</dd>`).join("")).join(""); }

    if (cat) a.cat = cat; if (dtIn(p[2])) { a.nasc = dtIn(p[2]); a.nascEst = false; } if (isNum(toNum(p[3]))) a.pn = toNum(p[3]); if (p[4]) a.lote = p[4].trim(); if (dtIn(p[5])) a.parto = dtIn(p[5]); if (p[6]) a.nome = p[6].trim(); if (dtIn(p[7])) a.ultIA = dtIn(p[7]); if (p[8]) { const e0 = norm(p[8]); const m0 = EST_VACA.concat(EST_NOV).find(x => norm(x) === e0); if (m0) a.estado = m0; } if (p[9]) a.mae = normId(p[9]);
    if (!a.nasc && nascFromBrinco(a.id)) { a.nasc = nascFromBrinco(a.id); a.nascEst = true; } });
  return {novos, atual};
}

const GEST = 283; // dias de gestação usados para o parto previsto
const addDays = (iso, n) => { const d = parseDate(iso); if (!d) return ""; d.setDate(d.getDate() + n); return isoDate(d); };
const daysTo = iso => { const d = parseDate(iso); if (!d) return null; return dayDiff(d, parseDate(todayIso())); };

function repro(a) {
  let est = a.estado || (a.cat === "vaca" ? "Vazia" : a.cat === "novilha" ? "Novilha" : a.cat === "bezerra" ? "Bezerra" : "—");
  const pren = ["Inseminada", "Prenhe", "Seca"].includes(est) && !!a.ultIA;
  const partoPrev = pren ? addDays(a.ultIA, GEST) : "";
  const secPrev = partoPrev && a.cat === "vaca" ? addDays(partoPrev, -60) : "";
  const prePrev = partoPrev ? addDays(partoPrev, -30) : "";
  let show = partoPrev && daysTo(prePrev) <= 0 ? "Pré-parto" : est;
  if (a.cat === "vaca" && est === "Vazia" && a.parto) { const del = -daysTo(a.parto); if (del >= 0) show = del < farmPev() ? "Em PEV" : "Aberta"; }
  return {est, show, partoPrev, secPrev, prePrev};
}

    (r.cr.rows || []).forEach(x => { if (isNum(x.peso)) m[normId(x.id)] = {peso: x.peso, data: d}; }); });
  return m;
}

// avisos de manejo: secagem, pré-parto, parto e confirmação de prenhez
function avisos(list) {
  const out = [];
  list.forEach(a => { if (a.cat !== "vaca" && a.cat !== "novilha") return; const r = repro(a);
    if (r.est === "Inseminada" && a.ultIA) { const d = daysTo(addDays(a.ultIA, 35)); if (d <= 7) out.push({a, tipo: "Confirmar prenhez (diagnóstico)", data: addDays(a.ultIA, 35), dias: d}); }
    if (!r.partoPrev) return;
    const dp = daysTo(r.partoPrev), dpp = daysTo(r.prePrev), ds = r.secPrev ? daysTo(r.secPrev) : null;
    if (a.cat === "vaca" && r.est !== "Seca" && ds !== null && ds <= 15) out.push({a, tipo: ds < 0 ? "Secar (atrasada)" : "Secar", data: r.secPrev, dias: ds});
    if (dpp <= 15 && dpp >= -7 && dp > 0) out.push({a, tipo: "Entrar no pré-parto", data: r.prePrev, dias: dpp});
    if (dp <= 30) out.push({a, tipo: dp < -10 ? "Parto previsto já passou: lançar o parto ou corrigir" : "Parto previsto", data: r.partoPrev, dias: dp});

function pdfKit(orient, titulo, subtitulo) {
  const {jsPDF} = window.jspdf; const doc = new jsPDF({orientation: orient, unit: "mm", format: "a4"});
  const W = orient === "landscape" ? 297 : 210, H = orient === "landscape" ? 210 : 297, mg = 12, tw = W - 2 * mg;

    doc.setFillColor(...NAVY); doc.rect(0, 0, W, 22, "F"); doc.addImage(LOGO, "PNG", mg, 4, 14 * LOGO_R, 14); doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text("Rotina PDPL", mg + 14 * LOGO_R + 3.5, 12.5);
    doc.setFontSize(14); doc.text(pdfTxt(titulo), W - mg, 10.5, {align: "right"}); doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.text(pdfTxt(subtitulo), W - mg, 16, {align: "right"});
    doc.setTextColor(...MUT); doc.setFontSize(7.5); doc.text(pdfTxt("Rotina PDPL · PDPL/PCEPL-UFV · gerado em " + brDate(todayIso())), mg, H - 6); doc.text(String(k.page), W - mg, H - 6, {align: "right"}); k.y = 31; };
  k.need = h => { if (k.y + h > H - 14) k.header(); };
  k.title = t => { k.need(16); doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(pdfTxt(t), mg, k.y); doc.setDrawColor(...NAVY); doc.setLineWidth(0.5); doc.line(mg, k.y + 2, W - mg, k.y + 2); doc.setLineWidth(0.2); k.y += 8; };
  k.text = (t, size = 9.5, color = MUT) => { doc.setFont("helvetica", "normal"); doc.setFontSize(size); doc.setTextColor(...color); const ls = doc.splitTextToSize(pdfTxt(t), tw); k.need(ls.length * 4.6 + 2); doc.text(ls, mg, k.y); k.y += ls.length * 4.6 + 2; };
  k.table = (cols, rows) => { const tot = cols.reduce((s, c0) => s + c0.w, 0); const ws = cols.map(c0 => c0.w / tot * tw); const rh = 6.8;
    const row = (cells, head) => { doc.setFont("helvetica", head ? "bold" : "normal"); doc.setFontSize(head ? 8.6 : 9.2);
      const lines = cells.map((t, i) => doc.splitTextToSize(pdfTxt(t ?? ""), ws[i] - 2.4).slice(0, head ? 2 : 1)); const h = head ? Math.max(...lines.map(l => l.length)) * 3.8 + 3.2 : rh;
      k.need(h + (head ? rh : 0)); if (head) { doc.setFillColor(...FILL); doc.rect(mg, k.y, tw, h, "F"); }
      doc.setTextColor(...(head ? [74, 83, 104] : INK)); let x = mg;
      lines.forEach((ls, i) => { if (cols[i].r) doc.text(ls, x + ws[i] - 1.2, k.y + 4.6, {align: "right"}); else doc.text(ls, x + 1.2, k.y + 4.6); x += ws[i]; });
      doc.setDrawColor(...LINE); doc.line(mg, k.y + h, mg + tw, k.y + h); k.y += h; };
    row(cols.map(c0 => c0.h), true); rows.forEach(r => { if (k.y + rh > H - 14) { k.header(); row(cols.map(c0 => c0.h), true); } row(r, false); }); k.y += 5; };
  k.header(); return k;
}

const RP_COL = {pev: "#9aa3b5", aberta: "#eb6834", insem: "#1f9bb5", prenhe: "#128c4c", descarte: "#b3261e"};
function rpClasse(a, del, pev) { const e = a.estado || "Vazia"; return e === "Descarte" ? "descarte" : e === "Prenhe" ? "prenhe" : e === "Inseminada" ? "insem" : del < pev ? "pev" : "aberta"; }
function reproStats(list, pev, iso) {

  const cnt = zero(), fx = [zero(), zero(), zero(), zero()], dels = [];

    dels.push(del); const k = rpClasse(a, del, pev); cnt[k]++; fx[del <= 100 ? 0 : del <= 200 ? 1 : del <= 300 ? 2 : 3][k]++; });
  const ps = list.filter(a => a.cat === "vaca" && a.parto && a.ultIA && ["Prenhe", "Seca"].includes(a.estado) && parseDate(a.ultIA) > parseDate(a.parto)).map(a => dayDiff(parseDate(a.ultIA), parseDate(a.parto)));

}

function avisosRecria(list, fid) {
  const out = []; const f = farms()[fid] || farm() || {}; const Pp = farmParams(f).pp; const Wt = lastWeights(fid); const Mt = metas(f); const iaMeta = (Mt.crIA && Mt.crIA.v) || 15; const desal = isNum(f.desal) ? f.desal : 60;

    if ((a.cat === "bezerra" || a.cat === "novilha") && idD >= 75 && idD <= 300 && !temVacina(fid, a.id, /bruc|b19|rb51/)) {
      const lim = addDays(a.nasc, 240); const d = daysTo(lim);
      out.push({a, tipo: d < 0 ? "Brucelose: passou dos 8 meses sem vacina registrada" : idD < 90 ? "Brucelose: vacinar a partir dos 3 meses" : "Vacinar contra brucelose (até 8 meses)", data: lim, dias: d}); }
    if ((a.cat === "bezerra" || a.cat === "macho")) { const dd = daysTo(addDays(a.nasc, desal)); if (dd <= 10 && dd >= -7) out.push({a, tipo: "Desaleitar (" + desal + " dias de idade)", data: addDays(a.nasc, desal), dias: dd}); }
    if ((a.cat === "novilha" || a.cat === "bezerra") && !["Inseminada", "Prenhe"].includes(a.estado || "")) {
      const w = Wt[normId(a.id)]; const meses = idD / MES;
      if (w && w.peso >= Pp) out.push({a, tipo: `Atingiu o peso para a 1ª IA (${fmt(w.peso, 0)} kg)`, data: w.data, dias: daysTo(w.data)});
      else if (meses >= iaMeta) out.push({a, tipo: `Atrasada para a 1ª IA (${fmt(meses, 1)} meses${w ? ", " + fmt(w.peso, 0) + " kg" : ""})`, data: addDays(a.nasc, Math.round(iaMeta * MES)), dias: daysTo(addDays(a.nasc, Math.round(iaMeta * MES)))}); }
  });
  ocorOf(fid).filter(o => o.prox && (o.tipo === "vacina" || o.tipo === "medic")).forEach(o => {
    const d = daysTo(o.prox); const depois = ocorOf(fid).some(x => x.tipo === o.tipo && norm(x.produto || "") === norm(o.produto || "") && (x.data || "") > (o.data || "") && x.id !== o.id);
    if (!depois && d <= 7 && d >= -30) { const n = ocAnimais(o).length; out.push({a: {id: n + (n === 1 ? " animal" : " animais"), nome: ""}, tipo: (o.tipo === "vacina" ? "Reforço da vacina " : "Próxima dose de ") + (o.produto || ""), data: o.prox, dias: d}); }
  });

}

        if (d.id.startsWith("farm_")) fsn[o.id] = o; else if (d.id.startsWith("rec_")) rsn[recKey(o.farmId, o.ym)] = o; else if (d.id.startsWith("anim_")) asn[o.farmId] = o.list || []; else if (d.id.startsWith("acoes_")) csn[o.farmId] = o.list || []; else if (d.id.startsWith("ocor_")) S.ocor[o.farmId] = o.list || []; else if (d.id === "livro") S.livro = o.list || []; });
      S.farms = fsn; S.recs = rsn; S.anims = asn; S.acoes = csn; S.loaded = true; calcCache.clear();
      if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus("cloud", "Salvo na nuvem"); }
      refreshSide();
      if (first || (!isDirty() && !["novo", "sobre", "metas"].includes(S.view))) render();

    }, () => { clearTimeout(timer); S.loaded = true; setStatus("local", "Erro ao carregar os dados"); refreshSide(); render(); });
  }).catch(useLocal);
})();
